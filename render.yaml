# AgriProvider Render Configuration
# Unified Web Service: Serves both the Fastify REST API and the Expo Web Portal on https://agriprovider-api-beyw.onrender.com
services:
  - type: web
    name: agriprovider-api
    runtime: node
    region: frankfurt
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate && pnpm build:web
    startCommand: pnpm --filter @agri/api start
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: "production"
      - key: INLINE_WORKER
        value: "true"
      - key: STORAGE_MODE
        value: "local"
      - key: MAIL_MODE
        value: "local"
      - key: APP_URL
        value: "https://agriprovider-api-beyw.onrender.com"
      - key: CORS_ORIGINS
        value: "https://agriprovider-api-beyw.onrender.com,http://localhost:8081,http://localhost:8082,http://10.2.44.28:8081,http://10.2.44.28:8082"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_KEY
        sync: false
