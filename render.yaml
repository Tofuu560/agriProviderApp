services:
  - type: web
    name: agriprovider-api
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @agri/api start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: agriprovider-secrets
      - key: NODE_ENV
        value: production
      - key: INLINE_WORKER
        value: "false"
  - type: web
    name: agriprovider-web
    runtime: static
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm build:web
    staticPublishPath: apps/mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        sync: false
  - type: worker
    name: agriprovider-worker
    runtime: node
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate
    startCommand: pnpm --filter @agri/api worker
    envVars:
      - fromGroup: agriprovider-secrets
      - key: NODE_ENV
        value: production
  - type: cron
    name: agriprovider-housekeeping
    runtime: node
    schedule: "0 * * * *"
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate
    startCommand: pnpm --filter @agri/api housekeeping
    envVars:
      - fromGroup: agriprovider-secrets
      - key: NODE_ENV
        value: production
envVarGroups:
  - name: agriprovider-secrets
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_KEY
        sync: false
      - key: STORAGE_MODE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLAMSCAN_PATH
        sync: false
      - key: PASSPORT_URL
        sync: false
      - key: PASSPORT_KEY
        sync: false
