# AgriProvider Render Blueprint
# Optimized for reliable, zero-configuration cloud deployment
services:
  - type: web
    name: agriprovider-api
    runtime: docker
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: "production"
      - key: INLINE_WORKER
        value: "true"
      - key: STORAGE_MODE
        value: "local"
      - key: MAIL_MODE
        value: "local"
      - key: APP_URL
        value: "https://agriprovider-api.onrender.com"
      - key: CORS_ORIGINS
        value: "https://agriprovider-api.onrender.com,http://localhost:8081,http://localhost:8082,http://10.2.44.28:8081,http://10.2.44.28:8082"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: TOKEN_KEY
        generateValue: true
